[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hackman3d-control-deck"
version = "1.4.15"
description = "HackMan3D Control Deck desktop configuration app"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
    "pynput>=1.7.7,<2",
    "pycaw>=20240210,<20270000; sys_platform == 'win32'",
    "pyobjc-framework-CoreWLAN>=10,<13; sys_platform == 'darwin'",
    "pyobjc-framework-CoreLocation>=10,<13; sys_platform == 'darwin'",
    "pyobjc-framework-Network>=10,<13; sys_platform == 'darwin'",
    "pyobjc-framework-libdispatch>=10,<13; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.5,<1",
    "pyinstaller>=6.8,<7",
    "ds-store>=1.3,<2",
    "mac-alias>=2.2,<3",
]

[project.scripts]
hackman3d-control-deck = "hackman_control_deck.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hackman_control_deck = [
    "assets/*.svg",
    "assets/*.png",
    "assets/*.ico",
    "assets/*.icns",
    "assets/firmware/*.hex",
    "assets/firmware/*.bin",
    "assets/tools/macos/*",
    "assets/tools/windows/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
