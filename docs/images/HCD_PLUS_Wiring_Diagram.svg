<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <title>HackMan3D Control Deck Plus wiring diagram</title>
  <desc>Arduino Pro Micro, MCP23017, twelve MX switches, two powered five-pin rotary encoder modules and two MOSFET-controlled lights.</desc>
  <defs>
    <style>
      text{font-family:Arial,sans-serif;fill:#171717}.title{font-size:42px;font-weight:700}.sub{font-size:18px;fill:#555}.section{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:700}.small{font-size:15px;fill:#555}.tiny{font-size:13px;fill:#666}text.white{fill:#fff}text.pintext{font-size:14px;font-weight:700;fill:#fff}.panel{fill:#fff;stroke:#c7c7c3;stroke-width:2}.chip{fill:#202020;stroke:#555;stroke-width:3}.pin{fill:#171717}.wire{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.vcc{stroke:#e63946}.gnd{stroke:#252525}.sda{stroke:#2677d3}.scl{stroke:#00a1a1}.sig{stroke:#8e44ad}.sw{stroke:#f29f05}.gate{stroke:#e0528d}.note{fill:#fff2e9;stroke:#ff9b6a;stroke-width:2}.module{fill:#f3f3f1;stroke:#777;stroke-width:2}.terminal{stroke:#555;stroke-width:2}
    </style>
  </defs>

  <rect width="1800" height="1100" fill="#f5f5f3"/>
  <rect x="38" y="34" width="1724" height="1032" rx="24" class="panel"/>
  <rect x="38" y="34" width="1724" height="12" rx="6" fill="#ff5b35"/>
  <text x="78" y="102" class="title">HackMan3D Control Deck Plus — Wiring diagram</text>
  <text x="78" y="140" class="sub">Pro Micro 5 V / 16 MHz · MCP23017 · 12 keys · 2 powered rotary encoder modules · firmware 1.1.2</text>

  <!-- shared power rails -->
  <path d="M85 165H1715" class="wire vcc"/>
  <text x="820" y="157" class="label" fill="#e63946">+5 V / VCC BUS</text>
  <path d="M85 875H1715" class="wire gnd"/>
  <text x="85" y="905" class="label">COMMON GND BUS</text>

  <!-- Pro Micro -->
  <rect x="65" y="195" width="410" height="640" rx="22" class="panel"/>
  <text x="92" y="238" class="section">1. Arduino Pro Micro</text>
  <rect x="130" y="275" width="225" height="485" rx="28" fill="#147fb6" stroke="#075a84" stroke-width="5"/>
  <text x="242" y="500" text-anchor="middle" class="white" style="font-size:23px;font-weight:700">ATmega32U4</text>
  <text x="242" y="530" text-anchor="middle" class="white" style="font-size:15px">5 V / 16 MHz</text>
  <rect x="183" y="703" width="118" height="57" rx="12" fill="#bbb" stroke="#777" stroke-width="3"/>
  <text x="242" y="738" text-anchor="middle" class="small">USB</text>

  <g>
    <rect x="105" y="300" width="82" height="32" rx="5" class="pin"/><text x="146" y="322" text-anchor="middle" class="pintext">VCC</text>
    <rect x="105" y="345" width="82" height="32" rx="5" class="pin"/><text x="146" y="367" text-anchor="middle" class="pintext">GND</text>
    <rect x="315" y="300" width="118" height="32" rx="5" class="pin"/><text x="374" y="322" text-anchor="middle" class="pintext">D2 / SDA</text>
    <rect x="315" y="345" width="118" height="32" rx="5" class="pin"/><text x="374" y="367" text-anchor="middle" class="pintext">D3 / SCL</text>
    <rect x="315" y="430" width="118" height="32" rx="5" class="pin"/><text x="374" y="452" text-anchor="middle" class="pintext">A0 · ENC1 CLK</text>
    <rect x="315" y="475" width="118" height="32" rx="5" class="pin"/><text x="374" y="497" text-anchor="middle" class="pintext">A1 · ENC1 DT</text>
    <rect x="315" y="520" width="118" height="32" rx="5" class="pin"/><text x="374" y="542" text-anchor="middle" class="pintext">A2 · ENC2 CLK</text>
    <rect x="315" y="565" width="118" height="32" rx="5" class="pin"/><text x="374" y="587" text-anchor="middle" class="pintext">D4 · ENC2 DT</text>
    <rect x="315" y="630" width="118" height="32" rx="5" class="pin"/><text x="374" y="652" text-anchor="middle" class="pintext">A3 / D21</text>
    <rect x="315" y="675" width="118" height="32" rx="5" class="pin"/><text x="374" y="697" text-anchor="middle" class="pintext">TX / D1</text>
  </g>
  <path d="M105 316H85V165" class="wire vcc"/><path d="M105 361H85V875" class="wire gnd"/>

  <!-- MCP23017 -->
  <rect x="515" y="195" width="610" height="640" rx="22" class="panel"/>
  <text x="542" y="238" class="section">2. MCP23017 + 12 MX keys</text>
  <rect x="700" y="285" width="245" height="405" rx="18" class="chip"/>
  <text x="822" y="455" text-anchor="middle" class="white" style="font-size:27px;font-weight:700">MCP23017</text>
  <text x="822" y="485" text-anchor="middle" class="white" style="font-size:16px">address 0x20–0x27</text>

  <g class="label">
    <text x="550" y="315">GPA0 → KEY 9</text><text x="550" y="350">GPA1 → KEY 10</text>
    <text x="550" y="385">GPA2 → KEY 11</text><text x="550" y="420">GPA3 → KEY 12</text>
    <text x="550" y="455">GPA4 → ENC1 SW</text><text x="550" y="490">GPA5 → ENC2 SW</text>
    <text x="970" y="315">GPB0 → KEY 1</text><text x="970" y="350">GPB1 → KEY 2</text>
    <text x="970" y="385">GPB2 → KEY 3</text><text x="970" y="420">GPB3 → KEY 4</text>
    <text x="970" y="455">GPB4 → KEY 5</text><text x="970" y="490">GPB5 → KEY 6</text>
    <text x="970" y="525">GPB6 → KEY 7</text><text x="970" y="560">GPB7 → KEY 8</text>
  </g>
  <rect x="550" y="595" width="540" height="76" rx="12" fill="#eaf7ef" stroke="#58a96b" stroke-width="2"/>
  <text x="570" y="626" class="label">Every key and SW input closes to GND</text>
  <text x="570" y="652" class="small">Internal pull-ups are enabled; no external pull-up resistor is needed.</text>
  <path d="M433 316H492V265H700" class="wire sda"/><text x="530" y="280" class="small" fill="#2677d3">SDA → pin 13</text>
  <path d="M433 361H500V720H735" class="wire scl"/><text x="530" y="744" class="small" fill="#00a1a1">SCL → pin 12</text>
  <path d="M822 285V165" class="wire vcc"/><text x="840" y="270" class="tiny">VDD + RESET</text>
  <path d="M822 690V875" class="wire gnd"/><text x="840" y="716" class="tiny">VSS + A0/A1/A2 address pins</text>

  <!-- Encoder modules -->
  <rect x="1165" y="195" width="570" height="365" rx="22" class="panel"/>
  <text x="1192" y="238" class="section">3. Powered encoder modules</text>
  <g>
    <rect x="1200" y="275" width="235" height="235" rx="18" class="module"/>
    <circle cx="1317" cy="326" r="35" fill="#777"/><text x="1317" y="385" text-anchor="middle" class="label">ENCODER 1</text>
    <text x="1220" y="420" class="small">+ → VCC 5 V</text><text x="1220" y="442" class="small">GND → common GND</text>
    <text x="1220" y="464" class="small">SW → MCP GPA4</text><text x="1220" y="486" class="small">DT → A1 · CLK → A0</text>
    <rect x="1460" y="275" width="235" height="235" rx="18" class="module"/>
    <circle cx="1577" cy="326" r="35" fill="#777"/><text x="1577" y="385" text-anchor="middle" class="label">ENCODER 2</text>
    <text x="1480" y="420" class="small">+ → VCC 5 V</text><text x="1480" y="442" class="small">GND → common GND</text>
    <text x="1480" y="464" class="small">SW → MCP GPA5</text><text x="1480" y="486" class="small">DT → D4 · CLK → A2</text>
  </g>
  <path d="M1260 275V165M1520 275V165" class="wire vcc"/>
  <path d="M1230 510V875M1490 510V875" class="wire gnd"/>
  <path d="M433 446H470V775H1190V486H1200" class="wire sig"/>
  <path d="M433 491H480V790H1180V470H1200" class="wire sig"/>
  <path d="M433 536H490V805H1450V486H1460" class="wire sig"/>
  <path d="M433 581H500V820H1440V470H1460" class="wire sig"/>
  <path d="M700 450H675V760H1170V454H1200" class="wire sw"/>
  <path d="M700 485H660V745H1425V454H1460" class="wire sw"/>

  <!-- lights -->
  <rect x="1165" y="590" width="570" height="245" rx="22" class="panel"/>
  <text x="1192" y="632" class="section">4. Status lights via IRLB8721</text>
  <text x="1192" y="674" class="label" fill="#d22">A3/D21 → 100 Ω → MOSFET gate → red connection LED</text>
  <text x="1192" y="711" class="label" fill="#337ab7">TX/D1 → 100 Ω → MOSFET gate → white action light</text>
  <text x="1192" y="750" class="small">Each source → GND · each drain → light negative · light positive → +5 V</text>
  <text x="1192" y="780" class="small">IRLB8721, printed face toward you: Gate · Drain · Source</text>
  <path d="M433 646H1128V665H1165" class="wire gate"/>
  <path d="M433 691H1115V705H1165" class="wire gate"/>

  <!-- notes -->
  <rect x="65" y="935" width="1670" height="105" rx="18" class="note"/>
  <text x="92" y="972" class="section">IMPORTANT</text>
  <text x="92" y="1003" class="label">Connect module “+” to VCC 5 V. Never connect or disconnect wiring while USB power is present.</text>
  <text x="92" y="1028" class="small">If an encoder turns backwards, exchange only its DT and CLK wires. All grounds must remain common.</text>
</svg>
