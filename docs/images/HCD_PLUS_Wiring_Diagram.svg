<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1500" viewBox="0 0 2200 1500" role="img" aria-labelledby="title description">
  <title id="title">HackMan3D Control Deck Plus complete wiring diagram</title>
  <desc id="description">Complete wiring for an Arduino Pro Micro, MCP23017, twelve MX switches, two five-pin rotary encoder modules, a red connection LED and a white feedback strip.</desc>
  <defs>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#171717}.title{font-size:42px;font-weight:800}.sub{font-size:17px;fill:#5d5d5d}.section{font-size:24px;font-weight:800}.label{font-size:16px;font-weight:700}.pintext{font-size:13px;font-weight:700;fill:#fff}.label.white,.small.white,.section.white{fill:#fff}.small{font-size:14px;fill:#555}.tiny{font-size:12px;fill:#666}.redText{fill:#d7263d}.panel{fill:#fff;stroke:#d2d2cd;stroke-width:2}.chip{fill:#252525;stroke:#666;stroke-width:3}.module{fill:#f2f2ef;stroke:#777;stroke-width:2}.pin{fill:#252525;stroke:#111;stroke-width:2}.wire{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.keywire{stroke:#ed9800}.vcc{stroke:#ed334d}.gnd{stroke:#303030}.sda{stroke:#2677d3}.scl{stroke:#00a1a1}.encoder{stroke:#b06acb}.encoderClk{stroke:#d14fa3}.encoderDt{stroke:#8b5cf6}.switchwire{stroke:#d18a00}.gate{stroke:#6557d9}.drain{stroke:#0b84a5}.gateText{fill:#b9a3ff}.drainText{fill:#53c7df}.component{fill:#f7e4c4;stroke:#9b6d2e;stroke-width:2}.terminal{fill:#fff;stroke:#333;stroke-width:2}
    </style>
    <g id="mxswitch"><rect x="0" y="0" width="125" height="54" rx="11" fill="#323232" stroke="#777" stroke-width="2"/><circle cx="0" cy="27" r="6" class="terminal"/><circle cx="125" cy="27" r="6" class="terminal"/></g>
  </defs>
  <rect width="2200" height="1500" fill="#f7f7f5"/><rect x="30" y="30" width="2140" height="1435" rx="24" class="panel"/><rect x="30" y="30" width="2140" height="13" rx="7" fill="#ff5b2d"/>
  <text x="70" y="100" class="title">HackMan3D Control Deck Plus — Complete Wiring Diagram</text>
  <text x="70" y="137" class="sub">Arduino Pro Micro 5 V / 16 MHz • MCP23017 at 0x20 • 12 keys • 2 clickable encoders • firmware 1.1.2</text>
  <path d="M65 170 H2135" class="wire vcc"/><text x="970" y="160" class="label">+5 V / VCC BUS</text>
  <path d="M65 1380 H2135" class="wire gnd"/><text x="70" y="1412" class="label">COMMON GND BUS</text>

  <!-- Arduino -->
  <rect x="60" y="205" width="430" height="620" rx="22" class="panel"/><text x="85" y="245" class="section">1. Arduino Pro Micro</text>
  <rect x="125" y="275" width="275" height="485" rx="28" fill="#147fba" stroke="#075887" stroke-width="5"/>
  <text x="262" y="505" text-anchor="middle" class="section white">ATmega32U4</text><text x="262" y="535" text-anchor="middle" class="small white">5 V / 16 MHz</text>
  <rect x="202" y="700" width="120" height="60" rx="12" fill="#bbb" stroke="#777" stroke-width="3"/><text x="262" y="738" text-anchor="middle" class="label">USB-C</text>
  <g class="label white">
    <rect x="112" y="300" width="48" height="30" rx="4" class="pin"/><text x="136" y="321" text-anchor="middle">VCC</text><rect x="112" y="345" width="48" height="30" rx="4" class="pin"/><text x="136" y="366" text-anchor="middle">GND</text>
    <rect x="290" y="292" width="147" height="30" rx="4" class="pin"/><text x="363" y="312" text-anchor="middle" class="pintext">D2 / SDA → MCP</text><rect x="290" y="337" width="147" height="30" rx="4" class="pin"/><text x="363" y="357" text-anchor="middle" class="pintext">D3 / SCL → MCP</text>
    <rect x="290" y="402" width="147" height="30" rx="4" class="pin"/><text x="363" y="422" text-anchor="middle" class="pintext">A0 / ENC1 CLK</text><rect x="290" y="447" width="147" height="30" rx="4" class="pin"/><text x="363" y="467" text-anchor="middle" class="pintext">A1 / ENC1 DT</text>
    <rect x="290" y="492" width="147" height="30" rx="4" class="pin"/><text x="363" y="512" text-anchor="middle" class="pintext">A2 / ENC2 CLK</text><rect x="290" y="537" width="147" height="30" rx="4" class="pin"/><text x="363" y="557" text-anchor="middle" class="pintext">D4 / ENC2 DT</text>
    <rect x="290" y="602" width="147" height="30" rx="4" class="pin"/><text x="363" y="622" text-anchor="middle" class="pintext">A3/D21 / RED GATE</text><rect x="290" y="647" width="147" height="30" rx="4" class="pin"/><text x="363" y="667" text-anchor="middle" class="pintext">TX/D1 / WHITE GATE</text>
  </g>
  <path d="M112 315 H85 V170" class="wire vcc"/><path d="M112 360 H85 V1380" class="wire gnd"/>

  <!-- MCP23017 -->
  <rect x="525" y="205" width="575" height="620" rx="22" class="panel"/><text x="550" y="245" class="section">2. MCP23017 I/O expander</text>
  <rect x="675" y="300" width="275" height="390" rx="18" class="chip"/><text x="812" y="465" text-anchor="middle" class="section white">MCP23017</text><text x="812" y="495" text-anchor="middle" class="small white">I²C address 0x20</text><text x="812" y="525" text-anchor="middle" class="small white">internal pull-ups enabled</text>
  <path d="M437 307 H575 V345 H675" class="wire sda"/><text x="525" y="332" class="tiny">SDA</text><path d="M437 352 H590 V650 H675" class="wire scl"/><text x="600" y="670" class="tiny">SCL</text>
  <path d="M750 300 V170 M875 300 V170" class="wire vcc"/><text x="708" y="286" class="tiny">VDD</text><text x="850" y="286" class="tiny">RESET</text>
  <path d="M750 690 V1380 M810 690 V1380 M870 690 V1380 M930 690 V1380" class="wire gnd"/><text x="710" y="716" class="tiny">VSS</text><text x="785" y="716" class="tiny">A0</text><text x="845" y="716" class="tiny">A1</text><text x="905" y="716" class="tiny">A2</text>
  <rect x="555" y="515" width="78" height="38" rx="7" class="component"/><text x="594" y="540" text-anchor="middle" class="label">100 nF</text><path d="M594 515 V170" class="wire vcc"/><path d="M594 553 V1380" class="wire gnd"/><text x="550" y="585" class="tiny">Decoupling capacitor between VDD and VSS</text>
  <g class="label"><text x="965" y="307">GPB0</text><text x="965" y="337">GPB1</text><text x="965" y="367">GPB2</text><text x="965" y="397">GPB3</text><text x="965" y="427">GPB4</text><text x="965" y="457">GPB5</text><text x="965" y="487">GPB6</text><text x="965" y="517">GPB7</text><text x="965" y="557">GPA0</text><text x="965" y="587">GPA1</text><text x="965" y="617">GPA2</text><text x="965" y="647">GPA3</text><text x="965" y="687">GPA4</text><text x="965" y="717">GPA5</text></g>

  <!-- Keys -->
  <rect x="1135" y="205" width="1000" height="620" rx="22" class="panel"/><text x="1160" y="245" class="section">3. Twelve MX switches — physical layout 3 × 4</text><text x="1160" y="270" class="small">Left terminal: dedicated MCP23017 input • Right terminal: common GND</text>
  <path d="M2080 290 V1380" class="wire gnd"/>
  <use href="#mxswitch" x="1240" y="320"/><text x="1302" y="353" text-anchor="middle" class="label white">KEY 1 · GPB0</text><use href="#mxswitch" x="1470" y="320"/><text x="1532" y="353" text-anchor="middle" class="label white">KEY 2 · GPB1</text><use href="#mxswitch" x="1700" y="320"/><text x="1762" y="353" text-anchor="middle" class="label white">KEY 3 · GPB2</text><use href="#mxswitch" x="1930" y="320"/><text x="1992" y="353" text-anchor="middle" class="label white">KEY 4 · GPB3</text>
  <use href="#mxswitch" x="1240" y="500"/><text x="1302" y="533" text-anchor="middle" class="label white">KEY 5 · GPB4</text><use href="#mxswitch" x="1470" y="500"/><text x="1532" y="533" text-anchor="middle" class="label white">KEY 6 · GPB5</text><use href="#mxswitch" x="1700" y="500"/><text x="1762" y="533" text-anchor="middle" class="label white">KEY 7 · GPB6</text><use href="#mxswitch" x="1930" y="500"/><text x="1992" y="533" text-anchor="middle" class="label white">KEY 8 · GPB7</text>
  <use href="#mxswitch" x="1240" y="680"/><text x="1302" y="713" text-anchor="middle" class="label white">KEY 9 · GPA0</text><use href="#mxswitch" x="1470" y="680"/><text x="1532" y="713" text-anchor="middle" class="label white">KEY 10 · GPA1</text><use href="#mxswitch" x="1700" y="680"/><text x="1762" y="713" text-anchor="middle" class="label white">KEY 11 · GPA2</text><use href="#mxswitch" x="1930" y="680"/><text x="1992" y="713" text-anchor="middle" class="label white">KEY 12 · GPA3</text>
  <!-- Each orange input is independent and enters only the left terminal of its switch. -->
  <path d="M950 302 H1110 V280 H1240 V347 M950 332 H1120 V288 H1470 V347 M950 362 H1130 V296 H1700 V347 M950 392 H1140 V304 H1930 V347" class="wire keywire"/>
  <path d="M950 422 H1110 V440 H1240 V527 M950 452 H1120 V448 H1470 V527 M950 482 H1130 V456 H1700 V527 M950 512 H1140 V464 H1930 V527" class="wire keywire"/>
  <path d="M950 552 H1110 V620 H1240 V707 M950 582 H1120 V628 H1470 V707 M950 612 H1130 V636 H1700 V707 M950 642 H1140 V644 H1930 V707" class="wire keywire"/>
  <!-- Right terminals join local row ground buses without passing through another switch. -->
  <path d="M1365 347 V400 H2080 M1595 347 V400 M1825 347 V400 M2055 347 V400" class="wire gnd"/>
  <path d="M1365 527 V580 H2080 M1595 527 V580 M1825 527 V580 M2055 527 V580" class="wire gnd"/>
  <path d="M1365 707 V760 H2080 M1595 707 V760 M1825 707 V760 M2055 707 V760" class="wire gnd"/>

  <!-- Encoders -->
  <rect x="60" y="860" width="1040" height="455" rx="22" class="panel"/><text x="85" y="900" class="section">4. Two powered five-pin rotary encoder modules</text>
  <rect x="95" y="935" width="430" height="285" rx="18" class="module"/><circle cx="310" cy="990" r="38" fill="#777"/><text x="310" y="1050" text-anchor="middle" class="section">ENCODER 1</text>
  <rect x="125" y="1135" width="58" height="32" rx="5" class="pin"/><text x="154" y="1156" text-anchor="middle" class="pintext white">GND</text><rect x="195" y="1135" width="58" height="32" rx="5" class="pin"/><text x="224" y="1156" text-anchor="middle" class="pintext white">+</text><rect x="265" y="1135" width="58" height="32" rx="5" class="pin"/><text x="294" y="1156" text-anchor="middle" class="pintext white">SW</text><rect x="335" y="1135" width="58" height="32" rx="5" class="pin"/><text x="364" y="1156" text-anchor="middle" class="pintext white">DT</text><rect x="405" y="1135" width="58" height="32" rx="5" class="pin"/><text x="434" y="1156" text-anchor="middle" class="pintext white">CLK</text>
  <text x="294" y="1195" text-anchor="middle" class="tiny">GPA4</text><text x="364" y="1195" text-anchor="middle" class="tiny">A1</text><text x="434" y="1195" text-anchor="middle" class="tiny">A0</text>
  <text x="154" y="1115" text-anchor="middle" class="tiny">BLACK</text><text x="224" y="1115" text-anchor="middle" class="tiny redText">RED</text>
  <rect x="565" y="935" width="430" height="285" rx="18" class="module"/><circle cx="780" cy="990" r="38" fill="#777"/><text x="780" y="1050" text-anchor="middle" class="section">ENCODER 2</text>
  <rect x="595" y="1135" width="58" height="32" rx="5" class="pin"/><text x="624" y="1156" text-anchor="middle" class="pintext white">GND</text><rect x="665" y="1135" width="58" height="32" rx="5" class="pin"/><text x="694" y="1156" text-anchor="middle" class="pintext white">+</text><rect x="735" y="1135" width="58" height="32" rx="5" class="pin"/><text x="764" y="1156" text-anchor="middle" class="pintext white">SW</text><rect x="805" y="1135" width="58" height="32" rx="5" class="pin"/><text x="834" y="1156" text-anchor="middle" class="pintext white">DT</text><rect x="875" y="1135" width="58" height="32" rx="5" class="pin"/><text x="904" y="1156" text-anchor="middle" class="pintext white">CLK</text>
  <text x="764" y="1195" text-anchor="middle" class="tiny">GPA5</text><text x="834" y="1195" text-anchor="middle" class="tiny">D4</text><text x="904" y="1195" text-anchor="middle" class="tiny">A2</text>
  <text x="624" y="1115" text-anchor="middle" class="tiny">BLACK</text><text x="694" y="1115" text-anchor="middle" class="tiny redText">RED</text>
  <path d="M154 1167 V1380 M624 1167 V1380" class="wire gnd"/><path d="M224 1167 V1235 H70 V170 M694 1167 V1245 H70" class="wire vcc"/>
  <path d="M437 417 H465 V825 H434 V1135 M437 507 H485 V845 H904 V1135" class="wire encoderClk"/>
  <path d="M437 462 H475 V835 H364 V1135 M437 552 H495 V855 H834 V1135" class="wire encoderDt"/>
  <path d="M950 682 H1050 V840 H294 V1135 M950 712 H1065 V850 H764 V1135" class="wire switchwire"/>

  <!-- Lighting -->
  <rect x="1135" y="860" width="1000" height="455" rx="22" class="panel"/><text x="1160" y="900" class="section">5. Connection and key-feedback lighting</text>
  <text x="1160" y="925" class="label">RED CONNECTION LED</text><path d="M437 617 H505 V835 H1115 V960 H1210" class="wire gate"/><rect x="1210" y="941" width="90" height="38" rx="7" class="component"/><text x="1255" y="966" text-anchor="middle" class="label">100 Ω</text><path d="M1300 960 H1330 V1055 H1380 V1030" class="wire gate"/>
  <rect x="1360" y="930" width="170" height="100" rx="9" class="chip"/><text x="1445" y="963" text-anchor="middle" class="label white">Q1 IRLB8721</text><text x="1380" y="1015" class="small gateText">G</text><text x="1440" y="1015" class="small drainText">D</text><text x="1500" y="1015" class="small white">S</text><path d="M1505 1030 V1100 H2100 V1380" class="wire gnd"/>
  <path d="M1850 170 V935" class="wire vcc"/><circle cx="1850" cy="970" r="24" fill="#ed3d50" stroke="#9b1523" stroke-width="4"/><path d="M1850 994 V1020" class="wire drain"/><rect x="1805" y="1020" width="90" height="38" rx="7" class="component"/><text x="1850" y="1045" text-anchor="middle" class="label">2 × 100 Ω</text><path d="M1850 1058 V1080 H1445 V1030" class="wire drain"/><text x="1700" y="1073" class="tiny">LED − → 200 Ω → D</text>
  <text x="1160" y="1110" class="label">WHITE 5 V COB FEEDBACK STRIP</text><path d="M437 662 H515 V845 H1125 V1145 H1210" class="wire gate"/><rect x="1210" y="1126" width="90" height="38" rx="7" class="component"/><text x="1255" y="1151" text-anchor="middle" class="label">100 Ω</text><path d="M1300 1145 H1320 V1255 H1380 V1230" class="wire gate"/>
  <rect x="1360" y="1130" width="170" height="100" rx="9" class="chip"/><text x="1445" y="1163" text-anchor="middle" class="label white">Q2 IRLB8721</text><text x="1380" y="1215" class="small gateText">G</text><text x="1440" y="1215" class="small drainText">D</text><text x="1500" y="1215" class="small white">S</text><path d="M1505 1230 V1280 H2100 V1380" class="wire gnd"/>
  <path d="M2120 170 V1145" class="wire vcc"/><rect x="1900" y="1145" width="220" height="90" rx="22" fill="#f8fbff" stroke="#7fa8d4" stroke-width="4"/><text x="2010" y="1180" text-anchor="middle" class="label">5 V COB strip</text><text x="2010" y="1206" text-anchor="middle" class="small">resistor built in</text><path d="M1900 1215 H1445 V1230" class="wire drain"/><text x="1660" y="1205" class="tiny">STRIP − → D • NO EXTRA RESISTOR</text>
  <rect x="60" y="1425" width="2075" height="28" rx="8" fill="#fff0e8"/><text x="80" y="1445" class="small">Colors: red = +5 V • black = GND/Source • blue = SDA • turquoise = SCL • orange = keys • purple = Gate • teal = Drain • pink = encoder rotation • ochre = encoder click</text>
</svg>
