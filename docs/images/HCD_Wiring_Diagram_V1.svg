<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title description">
  <title id="title">HackMan3D Control Deck V1 wiring diagram</title>
  <desc id="description">Validated wiring for nine MX switches, a red connection LED and a white feedback light driven by two IRLB8721 MOSFETs from an Arduino Pro Micro.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #171717; }
      .title { font-size: 42px; font-weight: 800; }
      .subtitle { font-size: 17px; fill: #5d5d5d; }
      .section { font-size: 25px; font-weight: 800; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 14px; fill: #555; }
      .tiny { font-size: 12px; fill: #666; }
      .white { fill: #fff; }
      .wire-key { stroke: #ef9800; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-signal { stroke: #e43c55; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-feedback { stroke: #367fc4; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-vcc { stroke: #ef334d; stroke-width: 6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-gnd { stroke: #303030; stroke-width: 6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .terminal { fill: #fff; stroke: #333; stroke-width: 3; }
      .port { fill: #252525; stroke: #111; stroke-width: 2; }
      .card { fill: #fff; stroke: #d7d7d2; stroke-width: 2; }
      .component { fill: #f7e4c4; stroke: #9b6d2e; stroke-width: 2; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1600" height="1100" fill="#f7f7f5"/>
  <rect x="35" y="35" width="1530" height="1030" rx="24" fill="#fff" stroke="#d8d8d3" stroke-width="2"/>
  <rect x="35" y="35" width="1530" height="13" rx="7" fill="#ff5b2d"/>

  <text x="75" y="105" class="title">HackMan3D Control Deck — Wiring Diagram</text>
  <text x="75" y="143" class="subtitle">HCD-BASE • Arduino Pro Micro USB-C, 5 V / 16 MHz • Validated against firmware 1.7.1</text>

  <text x="75" y="205" class="section">1. Nine MX switches</text>
  <text x="75" y="233" class="small">Each switch connects between its dedicated input and the common GND bus. Firmware uses INPUT_PULLUP.</text>

  <!-- Common switch ground bus -->
  <path d="M78 270 V850 H555 V900" class="wire-gnd"/>
  <text x="78" y="885" class="label">COMMON GND BUS</text>

  <!-- Key 1 -->
  <text x="105" y="278" class="label">KEY 1</text>
  <rect x="175" y="250" width="145" height="42" rx="10" fill="#323232" stroke="#777" stroke-width="2"/>
  <circle cx="175" cy="271" r="6" class="terminal"/><circle cx="320" cy="271" r="6" class="terminal"/>
  <path d="M78 271 H169 M326 271 H580" class="wire-key"/>
  <text x="525" y="263" class="label" fill="#bf7300">D4</text>

  <!-- Key 2 -->
  <text x="105" y="343" class="label">KEY 2</text>
  <rect x="175" y="315" width="145" height="42" rx="10" fill="#323232" stroke="#777" stroke-width="2"/>
  <circle cx="175" cy="336" r="6" class="terminal"/><circle cx="320" cy="336" r="6" class="terminal"/>
  <path d="M78 336 H169 M326 336 H580" class="wire-key"/>
  <text x="525" y="328" class="label" fill="#bf7300">D3</text>

  <!-- Key 3 -->
  <text x="105" y="408" class="label">KEY 3</text>
  <rect x="175" y="380" width="145" height="42" rx="10" fill="#323232" stroke="#777" stroke-width="2"/>
  <circle cx="175" cy="401" r="6" class="terminal"/><circle cx="320" cy="401" r="6" class="terminal"/>
  <path d="M78 401 H169 M326 401 H580" class="wire-key"/>
  <text x="525" y="393" class="label" fill="#bf7300">D2</text>

  <!-- Key 4 -->
  <text x="105" y="473" class="label">KEY 4</text>
  <rect x="175" y="445" width="145" height="42" rx="10" fill="#323232" stroke="#777" stroke-width="2"/>
  <circle cx="175" cy="466" r="6" class="terminal"/><circle cx="320" cy="466" r="6" class="terminal"/>
  <path d="M78 466 H169 M326 466 H580" class="wire-key"/>
  <text x="525" y="458" class="label" fill="#bf7300">D7</text>

  <!-- Key 5 -->
  <text x="105" y="538" class="label">KEY 5</text>
  <rect x="175" y="510" width="145" height="42" rx="10" fill="#323232" stroke="#777" stroke-width="2"/>
  <circle cx="175" cy="531" r="6" class="terminal"/><circle cx="320" cy="531" r="6" class="terminal"/>
  <path d="M78 531 H169 M326 531 H580" class="wire-key"/>
  <text x="525" y="523" class="label" fill="#bf7300">D6</text>

  <!-- Key 6 -->
  <text x="105" y="603" class="label">KEY 6</text>
  <rect x="175" y="575" width="145" height="42" rx="10" fill="#323232" stroke="#777" stroke-width="2"/>
  <circle cx="175" cy="596" r="6" class="terminal"/><circle cx="320" cy="596" r="6" class="terminal"/>
  <path d="M78 596 H169 M326 596 H580" class="wire-key"/>
  <text x="525" y="588" class="label" fill="#bf7300">D5</text>

  <!-- Key 7 -->
  <text x="105" y="668" class="label">KEY 7</text>
  <rect x="175" y="640" width="145" height="42" rx="10" fill="#323232" stroke="#777" stroke-width="2"/>
  <circle cx="175" cy="661" r="6" class="terminal"/><circle cx="320" cy="661" r="6" class="terminal"/>
  <path d="M78 661 H169 M326 661 H580" class="wire-key"/>
  <text x="513" y="653" class="label" fill="#bf7300">D10</text>

  <!-- Key 8 -->
  <text x="105" y="733" class="label">KEY 8</text>
  <rect x="175" y="705" width="145" height="42" rx="10" fill="#323232" stroke="#777" stroke-width="2"/>
  <circle cx="175" cy="726" r="6" class="terminal"/><circle cx="320" cy="726" r="6" class="terminal"/>
  <path d="M78 726 H169 M326 726 H580" class="wire-key"/>
  <text x="525" y="718" class="label" fill="#bf7300">D9</text>

  <!-- Key 9 -->
  <text x="105" y="798" class="label">KEY 9</text>
  <rect x="175" y="770" width="145" height="42" rx="10" fill="#323232" stroke="#777" stroke-width="2"/>
  <circle cx="175" cy="791" r="6" class="terminal"/><circle cx="320" cy="791" r="6" class="terminal"/>
  <path d="M78 791 H169 M326 791 H580" class="wire-key"/>
  <text x="525" y="783" class="label" fill="#bf7300">D8</text>

  <!-- Pro Micro -->
  <rect x="580" y="235" width="360" height="680" rx="32" fill="#147fba" stroke="#075887" stroke-width="5" filter="url(#shadow)"/>
  <text x="760" y="285" text-anchor="middle" class="section white">Arduino Pro Micro</text>
  <text x="760" y="313" text-anchor="middle" class="small white">ATmega32U4 • 5 V / 16 MHz</text>
  <rect x="665" y="390" width="190" height="190" rx="28" fill="#363636" stroke="#222" stroke-width="4" transform="rotate(45 760 485)"/>
  <text x="760" y="475" text-anchor="middle" class="section white">ATmega32U4</text>
  <text x="760" y="505" text-anchor="middle" class="small white">HCD firmware 1.7.1</text>
  <rect x="685" y="850" width="150" height="90" rx="15" fill="#b9b9b9" stroke="#707070" stroke-width="4"/>
  <rect x="710" y="874" width="100" height="66" rx="10" fill="#ececec"/>
  <text x="760" y="972" text-anchor="middle" class="label">USB-C</text>

  <!-- Pro Micro input terminals -->
  <g>
    <rect x="568" y="254" width="28" height="34" rx="4" class="port"/><text x="610" y="278" class="label white">D4</text>
    <rect x="568" y="319" width="28" height="34" rx="4" class="port"/><text x="610" y="343" class="label white">D3</text>
    <rect x="568" y="384" width="28" height="34" rx="4" class="port"/><text x="610" y="408" class="label white">D2</text>
    <rect x="568" y="449" width="28" height="34" rx="4" class="port"/><text x="610" y="473" class="label white">D7</text>
    <rect x="568" y="514" width="28" height="34" rx="4" class="port"/><text x="610" y="538" class="label white">D6</text>
    <rect x="568" y="579" width="28" height="34" rx="4" class="port"/><text x="610" y="603" class="label white">D5</text>
    <rect x="568" y="644" width="28" height="34" rx="4" class="port"/><text x="610" y="668" class="label white">D10</text>
    <rect x="568" y="709" width="28" height="34" rx="4" class="port"/><text x="610" y="733" class="label white">D9</text>
    <rect x="568" y="774" width="28" height="34" rx="4" class="port"/><text x="610" y="798" class="label white">D8</text>
    <rect x="568" y="883" width="28" height="34" rx="4" class="port"/><text x="610" y="907" class="label white">GND</text>
  </g>
  <path d="M555 900 H568" class="wire-gnd"/>

  <!-- Pro Micro status terminals -->
  <g>
    <rect x="924" y="324" width="28" height="34" rx="4" class="port"/><text x="820" y="348" class="label white">A3 / D21</text>
    <rect x="924" y="704" width="28" height="34" rx="4" class="port"/><text x="845" y="728" class="label white">TX / D1</text>
    <rect x="924" y="774" width="28" height="34" rx="4" class="port"/><text x="870" y="798" class="label white">VCC</text>
    <rect x="924" y="834" width="28" height="34" rx="4" class="port"/><text x="865" y="858" class="label white">GND</text>
  </g>

  <text x="1010" y="205" class="section">2. Status lighting</text>
  <path d="M952 791 H990 V225 H1530" class="wire-vcc"/>
  <text x="1010" y="218" class="label" fill="#d7263d">+5 V BUS (VCC)</text>
  <path d="M952 851 H990 V1005 H1530" class="wire-gnd"/>
  <text x="1390" y="1038" class="label">COMMON GND</text>

  <!-- Connection LED card -->
  <rect x="1015" y="255" width="515" height="315" rx="22" class="card"/>
  <text x="1045" y="298" class="section">RED CONNECTION LED</text>
  <text x="1045" y="327" class="small">ON only while the desktop app heartbeat is active</text>
  <path d="M952 341 H1060" class="wire-signal"/>
  <rect x="1060" y="322" width="92" height="38" rx="7" class="component"/>
  <text x="1106" y="347" text-anchor="middle" class="label">100 Ω</text>
  <path d="M1152 341 H1215" class="wire-signal"/>

  <rect x="1215" y="338" width="145" height="142" rx="9" fill="#333" stroke="#777" stroke-width="2"/>
  <text x="1287" y="375" text-anchor="middle" class="label white">Q1 IRLB8721</text>
  <text x="1287" y="400" text-anchor="middle" class="tiny white">flat face toward you</text>
  <text x="1228" y="463" class="small white">G</text><text x="1282" y="463" class="small white">D</text><text x="1337" y="463" class="small white">S</text>
  <path d="M1287 480 V505 H1420 V449" class="wire-signal"/>
  <path d="M1342 480 V535 H990" class="wire-gnd"/>

  <path d="M1455 225 V272" class="wire-vcc"/>
  <rect x="1410" y="272" width="90" height="38" rx="7" class="component"/>
  <text x="1455" y="297" text-anchor="middle" class="label">2 × 100 Ω</text>
  <path d="M1455 310 V360" class="wire-vcc"/>
  <circle cx="1455" cy="395" r="24" fill="#ed3d50" stroke="#9b1523" stroke-width="4"/>
  <path d="M1455 419 V449 H1420" class="wire-signal"/>
  <text x="1390" y="438" class="small">5 mm red LED</text>

  <!-- Feedback light card -->
  <rect x="1015" y="600" width="515" height="340" rx="22" class="card"/>
  <text x="1045" y="644" class="section">WHITE KEY-FEEDBACK BAR</text>
  <text x="1045" y="673" class="small">ON while a key is held, but only when the app is connected</text>
  <path d="M952 721 H1060" class="wire-feedback"/>
  <rect x="1060" y="702" width="92" height="38" rx="7" class="component"/>
  <text x="1106" y="727" text-anchor="middle" class="label">100 Ω</text>
  <path d="M1152 721 H1215" class="wire-feedback"/>

  <rect x="1215" y="718" width="145" height="142" rx="9" fill="#333" stroke="#777" stroke-width="2"/>
  <text x="1287" y="755" text-anchor="middle" class="label white">Q2 IRLB8721</text>
  <text x="1287" y="780" text-anchor="middle" class="tiny white">flat face toward you</text>
  <text x="1228" y="843" class="small white">G</text><text x="1282" y="843" class="small white">D</text><text x="1337" y="843" class="small white">S</text>
  <path d="M1287 860 V885 H1420 V830" class="wire-feedback"/>
  <path d="M1342 860 V905 H990" class="wire-gnd"/>

  <path d="M1455 225 V700" class="wire-vcc"/>
  <rect x="1390" y="700" width="130" height="130" rx="26" fill="#f8fbff" stroke="#7fa8d4" stroke-width="4"/>
  <text x="1455" y="753" text-anchor="middle" class="label">5 V COB strip</text>
  <text x="1455" y="780" text-anchor="middle" class="small">5 cm • resistor built in</text>
  <text x="1475" y="718" class="label" fill="#d7263d">+</text>
  <text x="1402" y="817" class="label" fill="#367fc4">−</text>
  <path d="M1390 817 H1420 V830" class="wire-feedback"/>

  <!-- Notes -->
  <rect x="75" y="930" width="855" height="100" rx="15" fill="#fff0e8" stroke="#ff9a73" stroke-width="2"/>
  <text x="98" y="966" class="label">IMPORTANT</text>
  <text x="98" y="993" class="small">All grounds must be common. Each MOSFET gate is driven through a 100 Ω series resistor.</text>
  <text x="98" y="1018" class="small">For a bare LED, keep the series current-limiting resistor. Do not add one to a 5 V strip that already includes it.</text>

  <text x="1025" y="965" class="small">IRLB8721 TO-220, flat printed face toward you:</text>
  <text x="1025" y="993" class="label">Pin 1 = Gate • Pin 2 = Drain • Pin 3 = Source</text>
  <text x="1025" y="1022" class="tiny">Signal wires: orange = keys • pink = connection • blue = feedback • red = +5 V • black = GND</text>
</svg>
