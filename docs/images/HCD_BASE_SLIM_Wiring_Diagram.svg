<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <style>
      .title{font-family:Arial,sans-serif;font-size:42px;font-weight:700;fill:#121212}.subtitle{font-family:Arial,sans-serif;font-size:20px;fill:#555}
      .section{font-family:Arial,sans-serif;font-size:25px;font-weight:700;fill:#171717}.label{font-family:Arial,sans-serif;font-size:18px;font-weight:700;fill:#202020}
      .small{font-family:Arial,sans-serif;font-size:16px;fill:#333}.tiny{font-family:Arial,sans-serif;font-size:14px;fill:#555}
      .signal{fill:none;stroke:#f59e0b;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
      .ground{fill:none;stroke:#27272a;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .power{fill:none;stroke:#ef3340;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .gate{fill:none;stroke:#2563eb;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
      .drain{fill:none;stroke:#8b5cf6;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
      .pin{fill:#242424;stroke:#050505;stroke-width:2}.unused{opacity:.35}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".18"/></filter>
  </defs>

  <rect width="1800" height="1200" fill="#f5f5f3"/>
  <rect x="35" y="35" width="1730" height="1130" rx="28" fill="#fff" stroke="#d2d2ce" stroke-width="2"/>
  <rect x="35" y="35" width="1730" height="14" rx="7" fill="#ff5a2a"/>
  <text x="80" y="105" class="title">HackMan3D Control Deck Base Slim — Wiring diagram</text>
  <text x="80" y="145" class="subtitle">ESP32-C3 Super Mini · USB-C · 9 low-profile switches · HCD Base Slim firmware</text>

  <text x="80" y="190" class="section">1. Keys 1 to 5</text>
  <!-- top switches -->
  <g filter="url(#shadow)">
    <g transform="translate(120 225)"><rect width="150" height="58" rx="14" fill="#292929"/><circle cx="18" cy="29" r="7" fill="#ddd"/><circle cx="132" cy="29" r="7" fill="#ddd"/><text x="75" y="-10" text-anchor="middle" class="label">Key 1</text></g>
    <g transform="translate(310 225)"><rect width="150" height="58" rx="14" fill="#292929"/><circle cx="18" cy="29" r="7" fill="#ddd"/><circle cx="132" cy="29" r="7" fill="#ddd"/><text x="75" y="-10" text-anchor="middle" class="label">Key 2</text></g>
    <g transform="translate(500 225)"><rect width="150" height="58" rx="14" fill="#292929"/><circle cx="18" cy="29" r="7" fill="#ddd"/><circle cx="132" cy="29" r="7" fill="#ddd"/><text x="75" y="-10" text-anchor="middle" class="label">Key 3</text></g>
    <g transform="translate(690 225)"><rect width="150" height="58" rx="14" fill="#292929"/><circle cx="18" cy="29" r="7" fill="#ddd"/><circle cx="132" cy="29" r="7" fill="#ddd"/><text x="75" y="-10" text-anchor="middle" class="label">Key 4</text></g>
    <g transform="translate(880 225)"><rect width="150" height="58" rx="14" fill="#292929"/><circle cx="18" cy="29" r="7" fill="#ddd"/><circle cx="132" cy="29" r="7" fill="#ddd"/><text x="75" y="-10" text-anchor="middle" class="label">Key 5</text></g>
  </g>

  <!-- C3 board -->
  <g filter="url(#shadow)">
    <rect x="390" y="385" width="720" height="360" rx="22" fill="#20262b" stroke="#0e1113" stroke-width="5"/>
    <rect x="390" y="490" width="95" height="150" rx="10" fill="#aeb5ba" stroke="#6f777d" stroke-width="4"/>
    <rect x="485" y="430" width="555" height="270" rx="14" fill="#273139" stroke="#3a4650" stroke-width="3"/>
    <rect x="730" y="500" width="150" height="150" rx="18" fill="#161a1e" transform="rotate(45 805 575)"/>
    <text x="805" y="570" text-anchor="middle" fill="#fff" font-family="Arial" font-size="26" font-weight="700">ESP32-C3</text>
    <text x="805" y="603" text-anchor="middle" fill="#bbc4ca" font-family="Arial" font-size="19">Super Mini</text>
    <text x="433" y="672" text-anchor="middle" class="small">USB-C</text>
  </g>

  <!-- board top pins: physical labels -->
  <g>
    <g transform="translate(520 365)"><circle r="13" class="pin"/><text y="-22" text-anchor="middle" class="label">0</text></g>
    <g transform="translate(585 365)"><circle r="13" class="pin"/><text y="-22" text-anchor="middle" class="label">1</text></g>
    <g transform="translate(650 365)"><circle r="13" class="pin"/><text y="-22" text-anchor="middle" class="label">2</text></g>
    <g transform="translate(715 365)"><circle r="13" class="pin"/><text y="-22" text-anchor="middle" class="label">3</text></g>
    <g transform="translate(780 365)"><circle r="13" class="pin"/><text y="-22" text-anchor="middle" class="label">4</text></g>
    <g transform="translate(845 365)" class="unused"><circle r="13" class="pin"/><text y="-22" text-anchor="middle" class="label">3V3</text></g>
    <g transform="translate(950 365)"><circle r="13" class="pin"/><text y="-22" text-anchor="middle" class="label">GND</text></g>
    <g transform="translate(1065 365)"><circle r="13" class="pin"/><text y="-22" text-anchor="middle" class="label">5V</text></g>
  </g>
  <!-- board bottom pins -->
  <g>
    <g transform="translate(520 765)"><circle r="13" class="pin"/><text y="35" text-anchor="middle" class="label">21</text></g>
    <g transform="translate(585 765)"><circle r="13" class="pin"/><text y="35" text-anchor="middle" class="label">20</text></g>
    <g transform="translate(650 765)"><circle r="13" class="pin"/><text y="35" text-anchor="middle" class="label">10</text></g>
    <g transform="translate(715 765)" class="unused"><circle r="13" class="pin"/><text y="35" text-anchor="middle" class="label">9</text></g>
    <g transform="translate(780 765)" class="unused"><circle r="13" class="pin"/><text y="35" text-anchor="middle" class="label">8</text></g>
    <g transform="translate(845 765)"><circle r="13" class="pin"/><text y="35" text-anchor="middle" class="label">7</text></g>
    <g transform="translate(910 765)"><circle r="13" class="pin"/><text y="35" text-anchor="middle" class="label">6</text></g>
    <g transform="translate(975 765)"><circle r="13" class="pin"/><text y="35" text-anchor="middle" class="label">5</text></g>
  </g>

  <!-- signals top switches -->
  <path class="signal" d="M252 254 V315 H520 V352"/><path class="signal" d="M442 254 V305 H585 V352"/>
  <path class="signal" d="M632 254 V295 H650 V352"/><path class="signal" d="M822 254 V305 H715 V352"/>
  <path class="signal" d="M1012 254 V315 H780 V352"/>
  <text x="530" y="312" class="tiny" fill="#a35f00">GPIO0</text><text x="590" y="300" class="tiny" fill="#a35f00">GPIO1</text>
  <text x="655" y="288" class="tiny" fill="#a35f00">GPIO2</text><text x="720" y="300" class="tiny" fill="#a35f00">GPIO3</text><text x="785" y="312" class="tiny" fill="#a35f00">GPIO4</text>

  <!-- top common ground -->
  <path class="ground" d="M138 254 V330 H950 V352"/><path class="ground" d="M328 254 V330"/><path class="ground" d="M518 254 V330"/><path class="ground" d="M708 254 V330"/><path class="ground" d="M898 254 V330"/>
  <text x="105" y="352" class="label">COMMON GND</text>

  <text x="80" y="850" class="section">2. Keys 6 to 9</text>
  <!-- bottom switches -->
  <g filter="url(#shadow)">
    <g transform="translate(620 875)"><rect width="150" height="58" rx="14" fill="#292929"/><circle cx="18" cy="29" r="7" fill="#ddd"/><circle cx="132" cy="29" r="7" fill="#ddd"/><text x="75" y="88" text-anchor="middle" class="label">Key 9 · GPIO10</text></g>
    <g transform="translate(810 875)"><rect width="150" height="58" rx="14" fill="#292929"/><circle cx="18" cy="29" r="7" fill="#ddd"/><circle cx="132" cy="29" r="7" fill="#ddd"/><text x="75" y="88" text-anchor="middle" class="label">Key 8 · GPIO7</text></g>
    <g transform="translate(1000 875)"><rect width="150" height="58" rx="14" fill="#292929"/><circle cx="18" cy="29" r="7" fill="#ddd"/><circle cx="132" cy="29" r="7" fill="#ddd"/><text x="75" y="88" text-anchor="middle" class="label">Key 7 · GPIO6</text></g>
    <g transform="translate(1190 875)"><rect width="150" height="58" rx="14" fill="#292929"/><circle cx="18" cy="29" r="7" fill="#ddd"/><circle cx="132" cy="29" r="7" fill="#ddd"/><text x="75" y="88" text-anchor="middle" class="label">Key 6 · GPIO5</text></g>
  </g>
  <path class="signal" d="M638 904 V830 H650 V778"/><path class="signal" d="M828 904 V820 H845 V778"/>
  <path class="signal" d="M1018 904 V830 H910 V778"/><path class="signal" d="M1208 904 V840 H975 V778"/>
  <path class="ground" d="M752 904 V1015 H1305"/><path class="ground" d="M942 904 V1015"/><path class="ground" d="M1132 904 V1015"/><path class="ground" d="M1322 904 V1015"/>
  <path class="ground" d="M950 378 V1015"/>

  <!-- right lighting block -->
  <rect x="1180" y="185" width="520" height="610" rx="24" fill="#fafafa" stroke="#d5d5d0" stroke-width="3"/>
  <text x="1220" y="230" class="section">3. Status lighting</text>
  <text x="1220" y="275" class="label" fill="#dc2638">RED CONNECTION LED · GPIO20</text>
  <path class="signal" d="M585 778 V815 H1140 V330 H1230"/>
  <rect x="1230" y="305" width="115" height="50" rx="9" fill="#f1dfbd" stroke="#9b6a26" stroke-width="2"/>
  <text x="1288" y="337" text-anchor="middle" class="label">220–330 Ω</text>
  <path class="signal" d="M1345 330 H1420"/>
  <circle cx="1460" cy="330" r="30" fill="#ef3340" stroke="#9f1728" stroke-width="5"/>
  <text x="1460" y="337" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">LED</text>
  <path class="ground" d="M1490 330 H1645 V730"/>
  <text x="1220" y="420" class="label" fill="#2563eb">WHITE FEEDBACK STRIP · GPIO21 + MOSFET</text>
  <path class="gate" d="M520 778 V825 H1110 V535 H1250"/>
  <rect x="1250" y="510" width="100" height="50" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="1300" y="542" text-anchor="middle" class="label">100 Ω</text>
  <path class="gate" d="M1350 535 H1390"/>
  <rect x="1390" y="475" width="145" height="165" rx="12" fill="#292929"/>
  <text x="1462" y="505" text-anchor="middle" fill="#fff" font-family="Arial" font-size="18" font-weight="700">MOSFET</text>
  <text x="1412" y="570" fill="#fff" font-family="Arial" font-size="18">G</text><text x="1455" y="620" fill="#fff" font-family="Arial" font-size="18">D</text><text x="1510" y="620" fill="#fff" font-family="Arial" font-size="18">S</text>
  <path class="drain" d="M1462 640 V690 H1545"/><path class="ground" d="M1515 640 V730 H1645"/>
  <rect x="1545" y="550" width="120" height="140" rx="18" fill="#fff" stroke="#8db5e5" stroke-width="5"/>
  <text x="1605" y="610" text-anchor="middle" class="label">LED strip</text><text x="1605" y="638" text-anchor="middle" class="small">5 V · 20 cm</text>
  <path class="power" d="M1065 378 V450 H1625 V550"/><text x="1460" y="445" class="label" fill="#d52232">+5 V direct</text>
  <text x="1560" y="710" class="tiny" fill="#6d28d9">− to Drain</text>
  <path class="ground" d="M1645 730 V1015 H1305"/>
  <text x="1510" y="760" class="label">COMMON GND</text>

  <!-- warning -->
  <rect x="80" y="1065" width="1620" height="70" rx="16" fill="#fff0e8" stroke="#ff9d77" stroke-width="2"/>
  <text x="110" y="1095" class="label">IMPORTANT</text>
  <text x="110" y="1123" class="small">Connect each switch between its GPIO and GND; no external pull-up is required. Do not hold GPIO2 while powering on. Never connect the 5 V strip directly to GPIO21.</text>
</svg>
